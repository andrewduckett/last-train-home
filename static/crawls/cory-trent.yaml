title: "Cory & Trent: Last Train Home"
color: amber
definition:
  appTitle: "Cory & Trent: Last Train Home"
  line: Palatine → Mt. Prospect → Edison Park → Arlington Heights → Palatine
  intro: |
    Cory & Trent are getting married! Come help us celebrate on a Metra bar crawl along the Union Pacific Northwest line: four towns, four bars, one very happy couple.
    
    Meet at Palatine Station by 2:45 PM and we'll finish back in Palatine for the last round. 
    
    **Don't forget**: $7 for a Metra Weekend Day Pass, which covers every ride all day (buy it in the Ventra app before you board), a charged phone, your ID, and a card for tabs. Close out your tab before each train. Trains don't wait, and neither do we!
