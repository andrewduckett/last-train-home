<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12161C" />
  <title>Suburban Line Crawl</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='88'%3E%F0%9F%9A%86%3C/text%3E%3C/svg%3E" />

  <!-- ============================================================= -->
  <!--  Libraries are served LOCALLY from ./vendor/ so a strict       -->
  <!--  Content-Security-Policy (script-src 'self') allows them, and  -->
  <!--  the app works with no internet. Run ./fetch-vendor.sh once to -->
  <!--  populate the vendor/ folder next to this file.                -->
  <!-- ============================================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script src="./vendor/tailwind.js"></script>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>

  <style>
    /* ---- Theme tokens: content surfaces adapt to light / dark ---- */
    :root {
      --bg:#EEF1F4; --surface:#FFFFFF; --ink:#181C22; --muted:#5A6472;
      --line:#E2E6EB; --accent:#C9762A; --accent-ink:#8A4E14;
      --rail:#177567; --good:#177567; --shadow:rgba(20,25,33,.09);
      /* The station "board" chrome stays dark in every theme */
      --board:#12161C; --board-2:#1B2129; --board-ink:#EDEFF3;
      --board-muted:#8B95A3; --board-line:#2A313C;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0F1319; --surface:#181D25; --ink:#E9ECF0; --muted:#98A2B0;
        --line:#2A313C; --accent:#F2A93B; --accent-ink:#F2A93B;
        --rail:#2FB7A0; --good:#2FB7A0; --shadow:rgba(0,0,0,.45);
      }
    }
    :root[data-theme="dark"] {
      --bg:#0F1319; --surface:#181D25; --ink:#E9ECF0; --muted:#98A2B0;
      --line:#2A313C; --accent:#F2A93B; --accent-ink:#F2A93B;
      --rail:#2FB7A0; --good:#2FB7A0; --shadow:rgba(0,0,0,.45);
    }

    html, body { background: var(--bg); }
    body {
      font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family:"Oswald", ui-sans-serif, system-ui, sans-serif; }
    .font-board   { font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    /* Split-flap style time pill */
    .time-pill {
      font-family:"IBM Plex Mono", ui-monospace, monospace;
      letter-spacing:.04em; font-variant-numeric: tabular-nums;
      background: var(--board); color:#F2A93B;
      border:1px solid var(--board-line);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.35);
    }

    /* Vertical rail line down the timeline */
    .rail-track { position:relative; }
    .rail-track::before {
      content:""; position:absolute; left:11px; top:6px; bottom:6px;
      width:2px; background: var(--line); border-radius:2px;
    }

    /* Custom checkbox rows */
    .check-row input { position:absolute; opacity:0; pointer-events:none; }
    .check-box {
      width:26px; height:26px; border-radius:8px; flex:0 0 auto;
      border:2px solid var(--line); background: var(--surface);
      display:grid; place-items:center; transition: all .12s ease;
    }
    .check-box svg { width:16px; height:16px; opacity:0; transform:scale(.5); transition: all .12s ease; }
    .check-row input:checked + .check-box { background: var(--good); border-color: var(--good); }
    .check-row input:checked + .check-box svg { opacity:1; transform:scale(1); }
    .check-row input:focus-visible + .check-box { outline:2px solid var(--accent); outline-offset:2px; }
    .check-row.done .check-label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }

    a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }

    /* Safe-area padding so bottom nav clears the home indicator */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- ============================================================= -->
  <!--  THE APP                                                       -->
  <!-- ============================================================= -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;

    /* ===============================================================
       CONFIG — the only things you need to swap out.
       ---------------------------------------------------------------
       1) GOOGLE MY MAPS:
          Open your map → Share → "Embed on my site" gives an <iframe>.
          Copy the `mid=...` value out of that iframe's src and paste it
          in place of PASTE_YOUR_MY_MAPS_ID_HERE below (BOTH lines).
          (The embed URL is used by the in-app map; the viewer URL is
          used by the "Open in Google Maps App" button.)
       2) VENTRA / METRA: swap for whatever links you prefer.
       =============================================================== */
    const CONFIG = {
      myMapsEmbedUrl: "https://www.google.com/maps/d/embed?mid=PASTE_YOUR_MY_MAPS_ID_HERE",
      myMapsAppUrl:   "https://www.google.com/maps/d/viewer?mid=PASTE_YOUR_MY_MAPS_ID_HERE",
      ventraUrl:      "https://www.ventrachicago.com/",
      metraUrl:       "https://metra.com/schedules/",
    };

    /* ---------------------------- Data ---------------------------- */
    const SCHEDULE = [
      { t:"1:45 PM", kind:"arrive", tag:"Be here by", title:"Meetup — Palatine Station", sub:"137 W. Wood St" },
      { t:"2:15 PM", kind:"depart", tag:"Depart",     title:"Depart Palatine",           sub:"Inbound train → Mt. Prospect" },
      { t:"2:25 PM", kind:"stop",   tag:"Be here by", title:"Stop 1 · Mt. Prospect Bar Stop" },
      { t:"3:42 PM", kind:"depart", tag:"Depart",     title:"Depart Mt. Prospect",       sub:"Inbound train → Edison Park" },
      { t:"4:00 PM", kind:"stop",   tag:"Be here by", title:"Stop 2 · Edison Park Bar Stop" },
      { t:"5:15 PM", kind:"depart", tag:"Depart",     title:"Depart Edison Park",        sub:"Outbound train → Arlington Heights" },
      { t:"5:40 PM", kind:"stop",   tag:"Be here by", title:"Stop 3 · Arlington Heights Bar Stop" },
      { t:"6:58 PM", kind:"depart", tag:"Depart",     title:"Depart Arlington Heights",  sub:"Outbound train → Palatine" },
      { t:"7:10 PM", kind:"stop",   tag:"Be here by", title:"Stop 4 · Palatine Final Landing" },
    ];

    const VENUES = [
      { stop:"Stop 1", town:"Mt. Prospect", places:[
        { n:"Whiskey Hill Brewery", a:"99 W Prospect Ave" },
        { n:"Mrs P & Me",           a:"100 E Prospect Ave" } ] },
      { stop:"Stop 2", town:"Edison Park", places:[
        { n:"Edison Park Inn", a:"6715 N Olmsted Ave" },
        { n:"Emerald Isle",    a:"6686 N Northwest Hwy" } ] },
      { stop:"Stop 3", town:"Arlington Heights", places:[
        { n:"Cortland's Garage", a:"1 N Vail Ave" } ] },
      { stop:"Stop 4", town:"Palatine", places:[
        { n:"Tap House Grill",  a:"56 W Wilson St" },
        { n:"Lamplighter Inn",  a:"60 N Bothwell St" } ] },
    ];

    const SCAVENGER = [
      { id:"sh-selfie",    t:"The Platform Selfie", p:10 },
      { id:"sh-toast",     t:"Train Car Toast",     p:10 },
      { id:"sh-tap",       t:"Local Tap Takeover",  p:10 },
      { id:"sh-stranger",  t:"Cheers to a Stranger",p:10 },
      { id:"sh-wave",      t:"The Conductor Wave",  p:10 },
      { id:"sh-landmark",  t:"Historic Landmark",   p:10 },
      { id:"sh-photobomb", t:"Bonus Photobomb",     p:25 },
    ];

    const COORDINATOR = [
      { id:"co-daypass", t:"Remind guests to buy $7 Metra Saturday Day Pass" },
      { id:"co-sweep",   t:"Do a final sweep of each bar 10 mins before departure" },
      { id:"co-call",    t:"Call venue managers 24 hours prior" },
    ];

    const LINE = "Palatine → Mt. Prospect → Edison Park → Arlington Heights → Palatine";

    /* ------------------- localStorage checklist ------------------- */
    const STORE_KEY = "crawl-checks-v1";
    function useChecks() {
      const [checks, setChecks] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
        catch { return {}; }
      });
      useEffect(() => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(checks)); } catch {}
      }, [checks]);
      const toggle = useCallback((id) =>
        setChecks((c) => ({ ...c, [id]: !c[id] })), []);
      const resetMany = useCallback((ids) =>
        setChecks((c) => { const n = { ...c }; ids.forEach((i) => delete n[i]); return n; }), []);
      return { checks, toggle, resetMany };
    }

    /* ----------------------- Small pieces ------------------------- */
    const Check = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5"
           strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    );

    function TimePill({ children }) {
      return (
        <span className="time-pill inline-flex items-center rounded-md px-2 py-1 text-[15px] font-semibold leading-none">
          {children}
        </span>
      );
    }

    function QuickLink({ href, label, hint }) {
      return (
        <a href={href} target="_blank" rel="noopener noreferrer"
           className="flex-1 rounded-2xl px-4 py-3 flex flex-col items-start justify-center active:scale-[.98] transition"
           style={{ background:"var(--surface)", border:"1px solid var(--line)", boxShadow:"0 1px 2px var(--shadow)" }}>
          <span className="font-display font-semibold text-[17px] tracking-wide" style={{ color:"var(--ink)" }}>{label}</span>
          <span className="text-xs mt-0.5" style={{ color:"var(--muted)" }}>{hint}</span>
        </a>
      );
    }

    /* --------------------------- Views ---------------------------- */
    function ScheduleView() {
      return (
        <div className="space-y-5">
          <div className="flex gap-3">
            <QuickLink href={CONFIG.ventraUrl} label="Ventra" hint="Buy & show your pass" />
            <QuickLink href={CONFIG.metraUrl}  label="Metra"  hint="Live train schedules" />
          </div>

          <section className="rail-track pl-9 pr-1">
            {SCHEDULE.map((s, i) => {
              const isDepart = s.kind === "depart";
              const dotStyle = isDepart
                ? { background:"var(--rail)", borderColor:"var(--rail)" }
                : { background:"var(--surface)", borderColor:"var(--accent)" };
              return (
                <div key={i} className="relative pb-5 last:pb-0">
                  {/* station dot */}
                  <span className="absolute -left-9 top-1 w-[22px] h-[22px] rounded-full border-[3px] grid place-items-center"
                        style={dotStyle}>
                    {isDepart && <span className="w-1.5 h-1.5 rounded-full" style={{ background:"#fff" }} />}
                  </span>

                  <div className="rounded-2xl p-3.5"
                       style={{ background:"var(--surface)", border:"1px solid var(--line)", boxShadow:"0 1px 2px var(--shadow)" }}>
                    <div className="flex items-center gap-2.5 mb-1.5">
                      <TimePill>{s.t}</TimePill>
                      <span className="text-[11px] font-semibold uppercase tracking-[.12em]"
                            style={{ color: isDepart ? "var(--rail)" : "var(--accent-ink)" }}>
                        {isDepart ? "▶ " : "◉ "}{s.tag}
                      </span>
                    </div>
                    <div className="font-display font-semibold text-[18px] leading-snug" style={{ color:"var(--ink)" }}>
                      {s.title}
                    </div>
                    {s.sub && <div className="text-[13.5px] mt-0.5" style={{ color:"var(--muted)" }}>{s.sub}</div>}
                  </div>
                </div>
              );
            })}
          </section>
        </div>
      );
    }

    function MapView() {
      const notSet = CONFIG.myMapsEmbedUrl.includes("PASTE_YOUR");
      return (
        <div className="space-y-4">
          {notSet && (
            <div className="rounded-xl px-3.5 py-3 text-[13px] leading-relaxed"
                 style={{ background:"rgba(201,118,42,.12)", border:"1px solid var(--accent)", color:"var(--accent-ink)" }}>
              <b>Map not set yet.</b> Paste your Google My Maps ID into the <code>CONFIG</code> block
              at the top of the app script (look for <code>PASTE_YOUR_MY_MAPS_ID_HERE</code>).
            </div>
          )}
          <div className="rounded-2xl overflow-hidden"
               style={{ border:"1px solid var(--line)", boxShadow:"0 1px 3px var(--shadow)", aspectRatio:"3 / 4" }}>
            <iframe title="Crawl route map" src={CONFIG.myMapsEmbedUrl}
                    className="w-full h-full" style={{ border:0 }} loading="lazy"
                    referrerPolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <a href={CONFIG.myMapsAppUrl} target="_blank" rel="noopener noreferrer"
             className="block w-full text-center rounded-2xl px-5 py-4 font-display font-semibold text-[19px] tracking-wide active:scale-[.99] transition"
             style={{ background:"var(--accent)", color:"#1a1206", boxShadow:"0 2px 8px var(--shadow)" }}>
            📍 Open in Google Maps App
          </a>
        </div>
      );
    }

    function VenuesView() {
      return (
        <div className="space-y-4">
          {VENUES.map((v) => (
            <div key={v.stop} className="rounded-2xl overflow-hidden"
                 style={{ background:"var(--surface)", border:"1px solid var(--line)", boxShadow:"0 1px 2px var(--shadow)" }}>
              <div className="flex items-baseline gap-2 px-4 py-2.5"
                   style={{ background:"var(--board)", color:"var(--board-ink)" }}>
                <span className="font-display font-bold text-[17px] tracking-wide" style={{ color:"#F2A93B" }}>{v.stop}</span>
                <span className="text-[13px] font-board" style={{ color:"var(--board-muted)" }}>{v.town}</span>
              </div>
              <div className="p-2">
                {v.places.map((p, idx) => (
                  <React.Fragment key={p.n}>
                    {idx > 0 && (
                      <div className="flex items-center gap-2 px-3 my-1">
                        <span className="h-px flex-1" style={{ background:"var(--line)" }} />
                        <span className="text-[11px] font-semibold tracking-widest" style={{ color:"var(--muted)" }}>OR</span>
                        <span className="h-px flex-1" style={{ background:"var(--line)" }} />
                      </div>
                    )}
                    <div className="flex items-center justify-between gap-3 px-3 py-2.5">
                      <div className="min-w-0">
                        <div className="font-semibold text-[16px] truncate" style={{ color:"var(--ink)" }}>{p.n}</div>
                        <div className="text-[13px]" style={{ color:"var(--muted)" }}>{p.a}</div>
                      </div>
                      <a href={"https://www.google.com/maps/search/?api=1&query=" +
                               encodeURIComponent(`${p.n}, ${p.a}, ${v.town}, IL`)}
                         target="_blank" rel="noopener noreferrer"
                         className="flex-none text-[13px] font-semibold rounded-full px-3 py-1.5 active:scale-95 transition"
                         style={{ color:"var(--accent-ink)", border:"1px solid var(--accent)" }}>
                        Directions
                      </a>
                    </div>
                  </React.Fragment>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function CheckRow({ item, checked, onToggle }) {
      return (
        <label className={"check-row flex items-center gap-3 px-3.5 py-3 cursor-pointer select-none " + (checked ? "done" : "")}>
          <input type="checkbox" checked={!!checked} onChange={onToggle} />
          <span className="check-box"><Check /></span>
          <span className="check-label flex-1 text-[15.5px] leading-snug" style={{ color:"var(--ink)" }}>{item.t}</span>
          {"p" in item && (
            <span className="font-board text-[13px] font-semibold flex-none" style={{ color: checked ? "var(--good)" : "var(--muted)" }}>
              {item.p} pts
            </span>
          )}
        </label>
      );
    }

    function ChecklistCard({ title, items, checks, toggle, onReset, header }) {
      return (
        <div className="rounded-2xl overflow-hidden"
             style={{ background:"var(--surface)", border:"1px solid var(--line)", boxShadow:"0 1px 2px var(--shadow)" }}>
          <div className="flex items-center justify-between px-4 pt-3.5 pb-2">
            <h2 className="font-display font-bold text-[19px] tracking-wide" style={{ color:"var(--ink)" }}>{title}</h2>
            <button onClick={onReset} className="text-[12px] font-semibold px-2 py-1 rounded-md" style={{ color:"var(--muted)" }}>
              Reset
            </button>
          </div>
          {header}
          <div className="divide-y" style={{ borderColor:"var(--line)" }}>
            {items.map((it) => (
              <CheckRow key={it.id} item={it} checked={checks[it.id]} onToggle={() => toggle(it.id)} />
            ))}
          </div>
        </div>
      );
    }

    function TasksView({ checks, toggle, resetMany }) {
      const earned = SCAVENGER.reduce((s, i) => s + (checks[i.id] ? i.p : 0), 0);
      const total  = SCAVENGER.reduce((s, i) => s + i.p, 0);
      const pct = Math.round((earned / total) * 100);
      const coDone = COORDINATOR.filter((i) => checks[i.id]).length;

      const scavengerHeader = (
        <div className="px-4 pb-3">
          <div className="flex items-baseline justify-between mb-1.5">
            <span className="font-board text-[13px]" style={{ color:"var(--muted)" }}>{pct}% collected</span>
            <span className="font-display font-bold text-[22px]" style={{ color:"var(--accent-ink)" }}>
              {earned}<span className="text-[14px]" style={{ color:"var(--muted)" }}> / {total} pts</span>
            </span>
          </div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{ background:"var(--line)" }}>
            <div className="h-full rounded-full transition-all" style={{ width: pct + "%", background:"var(--accent)" }} />
          </div>
        </div>
      );

      const coordHeader = (
        <div className="px-4 pb-2">
          <span className="font-board text-[13px]" style={{ color:"var(--muted)" }}>{coDone} of {COORDINATOR.length} done</span>
        </div>
      );

      const reset = (ids) => { if (confirm("Clear these checkmarks?")) resetMany(ids); };

      return (
        <div className="space-y-4">
          <ChecklistCard title="Coordinator Checklist" items={COORDINATOR} checks={checks}
            toggle={toggle} header={coordHeader} onReset={() => reset(COORDINATOR.map((i) => i.id))} />
          <ChecklistCard title="Scavenger Hunt" items={SCAVENGER} checks={checks}
            toggle={toggle} header={scavengerHeader} onReset={() => reset(SCAVENGER.map((i) => i.id))} />
        </div>
      );
    }

    /* --------------------------- Shell ---------------------------- */
    const TABS = [
      { id:"schedule", label:"Schedule", icon:"🕑" },
      { id:"map",      label:"Map",      icon:"🗺️" },
      { id:"venues",   label:"Venues",   icon:"🍺" },
      { id:"tasks",    label:"Tasks",    icon:"✅" },
    ];
    const TITLES = { schedule:"Schedule", map:"Route Map", venues:"Venues", tasks:"Tasks" };

    function App() {
      const [tab, setTab] = useState("schedule");
      const { checks, toggle, resetMany } = useChecks();

      useEffect(() => { window.scrollTo(0, 0); }, [tab]);

      return (
        <div className="min-h-screen mx-auto max-w-[520px] flex flex-col">
          {/* Station board header */}
          <header className="sticky top-0 z-20"
                  style={{ background:"var(--board)", borderBottom:"1px solid var(--board-line)" }}>
            <div className="px-4 pt-3 pb-2.5" style={{ paddingTop:"max(12px, env(safe-area-inset-top))" }}>
              <div className="flex items-center gap-2">
                <span className="text-[19px]">🚆</span>
                <h1 className="font-display font-bold text-[21px] tracking-wide" style={{ color:"var(--board-ink)" }}>
                  Suburban Line Crawl
                </h1>
              </div>
              <p className="font-board text-[11.5px] mt-0.5 truncate" style={{ color:"var(--board-muted)" }}>{LINE}</p>
            </div>
          </header>

          {/* Content */}
          <main className="flex-1 px-4 py-4">
            <h2 className="font-display font-semibold text-[13px] uppercase tracking-[.18em] mb-3" style={{ color:"var(--muted)" }}>
              {TITLES[tab]}
            </h2>
            {tab === "schedule" && <ScheduleView />}
            {tab === "map"      && <MapView />}
            {tab === "venues"   && <VenuesView />}
            {tab === "tasks"    && <TasksView checks={checks} toggle={toggle} resetMany={resetMany} />}
            <div className="h-6" />
          </main>

          {/* Sticky bottom nav (the departures board) */}
          <nav className="sticky bottom-0 z-20 safe-bottom"
               style={{ background:"var(--board)", borderTop:"1px solid var(--board-line)" }}>
            <div className="grid grid-cols-4">
              {TABS.map((t) => {
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)}
                          aria-current={active ? "page" : undefined}
                          className="relative flex flex-col items-center gap-0.5 py-2.5 active:scale-95 transition">
                    {active && <span className="absolute top-0 h-[3px] w-8 rounded-full" style={{ background:"var(--accent)" }} />}
                    <span className="text-[19px] leading-none" style={{ opacity: active ? 1 : .55 }}>{t.icon}</span>
                    <span className="text-[11px] font-semibold tracking-wide"
                          style={{ color: active ? "#F2A93B" : "var(--board-muted)" }}>{t.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
